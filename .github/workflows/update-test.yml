name: Проверка автообновления

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.js'
      - '.github/workflows/update-test.yml'

# Одно Mac-задание за раз (см. build-mac.yml).
concurrency:
  group: macos-runner
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Собрать «старую» версию 0.0.1
        run: |
          npm version 0.0.1 --no-git-tag-version
          npx electron-builder --mac dir --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Самообновление — проверка через API и через запасной путь
        run: |
          APP="/Applications/Time Management.app"
          for SOURCE in api page; do
            echo "::group::$SOURCE"
            pkill -f "Time Management.app/Contents/MacOS" || true
            rm -rf "$APP"
            ditto "dist/mac-arm64/Time Management.app" "$APP"
            if [ "$SOURCE" = page ]; then export TM_UPDATE_FORCE_PAGE=1; else unset TM_UPDATE_FORCE_PAGE; fi
            TM_UPDATE_SELFTEST=1 "$APP/Contents/MacOS/Time Management" > app.log 2>&1 &
            OK=0
            for i in $(seq 1 60); do
              sleep 5
              V=$(defaults read "$APP/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo "-")
              if [ "$V" != "0.0.1" ] && [ "$V" != "-" ]; then
                for j in $(seq 1 10); do
                  sleep 2
                  if pgrep -fl "Time Management.app/Contents/MacOS"; then OK=1; break; fi
                done
                break
              fi
            done
            echo "--- app.log"; cat app.log
            echo "--- update.log"; cat ~/Library/Logs/TimeManagement/update.log || true
            echo "::endgroup::"
            if [ "$OK" != 1 ]; then echo "FAIL ($SOURCE): версия $V"; exit 1; fi
            echo "OK ($SOURCE): обновилось до $V и перезапустилось"
            rm -f ~/Library/Logs/TimeManagement/update.log
          done
