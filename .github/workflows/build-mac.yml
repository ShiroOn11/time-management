name: Сборка для macOS

on:
  push:
    paths:
      - 'main.js'
      - 'preload.js'
      - 'renderer/**'
      - 'assets/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Собрать .dmg
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: time-management-mac
          path: dist/*.dmg

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Тайм-менеджмент · сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: dist/*.dmg
          body: |
            Скачайте файл `.dmg` ниже, откройте его и перетащите «Тайм-менеджмент» в «Программы».
            Первый запуск: см. раздел «Установка» в README.
