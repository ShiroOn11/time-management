<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Тайм-менеджмент</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="drag-strip"></div>
      <button class="quick-btn" data-act="quickAdd" title="⌥⌘N из любого приложения">
        <span>＋ Быстрая задача</span><kbd>⌥⌘N</kbd>
      </button>
      <nav id="nav"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>
    <main class="main">
      <div class="drag-strip top"></div>
      <div id="timerBar"></div>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="modal" class="modal-root"></div>
  <div id="toast" class="toast"></div>
  <script src="logic.js"></script>
  <script src="app.js"></script>

</html>
